[package]
name = "silo"
version = "0.1.0"
description = "Silo — Farming Simulator 25 mod library manager"
authors = ["HLLMR"]
license = "MIT"
repository = "https://github.com/HLLMR/silo"
edition = "2021"
rust-version = "1.77"

# The library holds all logic so it's unit-testable without a running app and
# reusable by a future CLI. main.rs is a thin entry point.
[lib]
name = "silo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
rayon = "1"
md5 = "0.7"
# Provenance manifest hashing (src/provenance.rs) — sha256 of entry/manifest bytes, NFC
# path normalization. Byte-exact parity with SiloAPI is contract-critical, so these back
# the ratified canonicalization (docs: PROVENANCE-CANONICALIZATION.md §7 test vectors).
sha2 = "0.10"
unicode-normalization = "0.1"
dirs = "5"
# Icon decoding: FS25 mod icons are usually .dds (BC1/BC3/BC7); some are .png/.jpg.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
image_dds = "0.7"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
# OS credential store for tokens (Windows Credential Manager / macOS Keychain / Linux
# Secret Service via pure-Rust zbus — no extra system libs). Falls back to SQLite only
# where no keychain exists; see src/secrets.rs.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

[profile.dev]
# Faster incremental dev builds; the heavy work is I/O-bound anyway.
incremental = true
