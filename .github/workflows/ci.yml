name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (svelte-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `npm run build` runs svelte-check AND vite build — catches type errors and a
      # broken production bundle in one step.
      - run: npm run build

  rust:
    name: Rust (fmt + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tauri v2 links webkit2gtk-4.1 at build time, so the deps are needed even to
      # compile the crate for `cargo test`.
      # Tauri v2's official Linux deps. On Ubuntu 24.04 (noble) the old
      # libappindicator3-dev CONFLICTS with libayatana-appindicator3-dev — use ayatana
      # only, or apt aborts with held broken packages.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test

  audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    # Informational for now: surfaces advisories in the log without blocking a build we
    # can't hotfix instantly. Flip to a hard gate once the first run is reviewed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        working-directory: src-tauri
        run: cargo audit
